[project]
name = "backend"
version = "0.1.0"
description = "RAG chat backend over a PDF knowledge base"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
